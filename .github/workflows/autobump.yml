name: autobump casks

on:
  push:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: packages-proposals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate and bump casks to latest upstream versions
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/bump-casks.sh
          for cask in Casks/*.rb; do ruby -c "$cask"; done
          if git diff --quiet -- Casks; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            mkdir -p build/proposal/Casks
            cp Casks/*.rb build/proposal/Casks/
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.bump.outputs.changed == 'true'
        with:
          name: source-proposal
          path: build/proposal
          if-no-files-found: error
          retention-days: 1

  # Keep environment secrets on a normal job: actions/runner#4453.
  propose:
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: package-updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-proposal
          path: build/proposal
      - name: Stage only the validated source paths
        env:
          KIND: casks
        run: |
          case "$KIND" in
            releases)
              mkdir -p Formula manifests
              cp build/proposal/Formula/*.rb Formula/
              cp build/proposal/manifests/releases.json manifests/releases.json
              ;;
            casks) cp build/proposal/Casks/*.rb Casks/ ;;
            *) echo 'unsupported proposal kind' >&2; exit 1 ;;
          esac
      - name: Create narrowly scoped PR credential
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: wawrzdev
          repositories: packages
          permission-contents: write
          permission-pull-requests: write
      - name: Open source PR and request rebase auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: casks
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/open-update-pr.sh "$KIND" "$BASE_SHA"
