name: autobump casks

on:
  push:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: packages-proposals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate and bump casks to latest upstream versions
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/bump-casks.sh
          for cask in Casks/*.rb; do ruby -c "$cask"; done
          if git diff --quiet -- Casks; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            mkdir -p build/proposal/Casks
            cp Casks/*.rb build/proposal/Casks/
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.bump.outputs.changed == 'true'
        with:
          name: source-proposal
          path: build/proposal
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/write-update-pr.yml
    with:
      kind: casks
      base_sha: ${{ needs.prepare.outputs.base_sha }}
