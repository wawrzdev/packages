name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Python unit and integration tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py tests/*.py
      - name: Exercise no-release bootstrap flow
        run: |
          mkdir -p /tmp/packages-bootstrap
          GH_TOKEN=unused python3 scripts/publish_release.py \
            --manifest manifests/releases.json \
            --manifest-output /tmp/packages-bootstrap/releases.json \
            --output /tmp/packages-bootstrap/site \
            --formula-output /tmp/packages-bootstrap/formula.rb
          test -f /tmp/packages-bootstrap/site/apt/dists/stable/Release
          test -d /tmp/packages-bootstrap/site/pacman/x86_64
          test ! -e /tmp/packages-bootstrap/formula.rb
      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh tests/*.sh
          shellcheck scripts/*.sh tests/*.sh
      - name: Validate Ruby package definitions
        run: |
          for file in Casks/*.rb Formula/*.rb; do
            if [ -e "$file" ]; then ruby -c "$file"; fi
          done
      - name: Validate workflow syntax
        run: /tmp/actionlint
      - name: End-to-end signed APT and Pacman repositories
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install --yes gnupg pacman-package-manager libarchive-tools zstd
          bash tests/integration-packages.sh

  homebrew-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/integration-homebrew.sh

  homebrew-linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/integration-homebrew.sh
