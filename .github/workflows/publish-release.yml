name: publish package release

on:
  repository_dispatch:
    types:
      - secret-release-published
      - snip-release-published
      - wtf-release-published
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: packages-main-writes
  cancel-in-progress: false

jobs:
  validate:
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      base_sha: ${{ steps.base.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Record exact manifest base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install package readers
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Verify immutable source release and build repositories
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--manifest manifests/releases.json --manifest-output build/releases.json --output build/site --formula-output build/Formula.rb)
          if [ "$EVENT_NAME" = repository_dispatch ]; then args+=(--event "$GITHUB_EVENT_PATH"); fi
          python3 scripts/publish_release.py "${args[@]}"
      - name: Normalize formula filename
        if: steps.publish.outputs.app != ''
        env:
          APP: ${{ steps.publish.outputs.app }}
        run: mkdir -p build/Formula && mv build/Formula.rb "build/Formula/$APP.rb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.publish.outputs.changed == 'true'
        with:
          name: verified-package-repositories
          path: build
          if-no-files-found: error
          retention-days: 1

  validate-homebrew:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/homebrew/brew@sha256:613f2f524c4d1fb8fe37dbe7a5581392c89e7865bac725bab0d8e24309ae6d7c
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-package-repositories
          path: build
      - name: Audit, install, and test generated formula
        run: |
          if compgen -G 'build/Formula/*.rb' >/dev/null; then
            brew style build/Formula/*.rb
            brew audit --strict build/Formula/*.rb
            brew install --formula build/Formula/*.rb
            for formula in build/Formula/*.rb; do brew test "$(basename "$formula" .rb)"; done
          fi

  sign-packages:
    needs: [validate, validate-homebrew]
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: package-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-package-repositories
          path: build
      - name: Sign package bytes in an isolated keyring
        env:
          PACKAGES_GPG_PRIVATE_KEY_B64: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY_B64 }}
          PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
          PACKAGES_GPG_FINGERPRINT: ${{ vars.PACKAGES_GPG_FINGERPRINT }}
        run: bash scripts/sign-repositories.sh packages build/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-signed-repositories
          path: build
          if-no-files-found: error
          retention-days: 1

  build-indexes:
    needs: [validate, sign-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-signed-repositories
          path: build
      - name: Install Pacman repository tools
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
          sudo apt-get install --yes pacman-package-manager
      - name: Build package and file indexes without private keys
        run: bash scripts/build-pacman-repositories.sh build/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexed-package-repositories
          path: build
          if-no-files-found: error
          retention-days: 1

  sign-and-commit:
    needs: [validate, build-indexes]
    runs-on: ubuntu-latest
    environment: package-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.base_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: indexed-package-repositories
          path: build
      - name: Sign repository metadata in a fresh isolated keyring
        env:
          PACKAGES_GPG_PRIVATE_KEY_B64: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY_B64 }}
          PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
          PACKAGES_GPG_FINGERPRINT: ${{ vars.PACKAGES_GPG_FINGERPRINT }}
        run: bash scripts/sign-repositories.sh metadata build/site
      - name: Validate final Pages tree
        run: python3 scripts/validate_site.py build/site
      - name: Commit verified formula and repository state atomically
        env:
          EXPECTED_HEAD: ${{ needs.validate.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$EXPECTED_HEAD"
          rm -rf site
          mv build/site site
          if compgen -G 'build/Formula/*.rb' >/dev/null; then cp build/Formula/*.rb Formula/; fi
          git config user.name "packages-release[bot]"
          git config user.email "wawrz.dev@gmail.com"
          mkdir -p manifests
          mv build/releases.json manifests/releases.json
          git add manifests/releases.json
          if [ -d Formula ]; then git add Formula; fi
          if ! git diff --cached --quiet; then
            git commit -m "packages: publish verified release"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: sign-and-commit
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy package repositories
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000
