name: write verified update PR

on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      base_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  propose:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: package-updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-proposal
          path: build/proposal
      - name: Stage only the validated source paths
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in
            releases)
              mkdir -p Formula manifests
              cp build/proposal/Formula/*.rb Formula/
              cp build/proposal/manifests/releases.json manifests/releases.json
              ;;
            casks) cp build/proposal/Casks/*.rb Casks/ ;;
            *) echo 'unsupported proposal kind' >&2; exit 1 ;;
          esac
      - name: Create narrowly scoped PR credential
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: wawrzdev
          repositories: packages
          permission-contents: write
          permission-pull-requests: write
      - name: Open source PR and request rebase auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: ${{ inputs.kind }}
          BASE_SHA: ${{ inputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/open-update-pr.sh "$KIND" "$BASE_SHA"
